name: Intern Finder

on:
  schedule:
    # 4:00 and 16:00 America/New_York ≈ 08:00 and 20:00 UTC (EDT)
    # Adjust if you need DST-aware timing via a cron wrapper.
    - cron: "0 8,20 * * *"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write service-account credentials
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python -c "import os,pathlib; pathlib.Path('credentials.json').write_text(os.environ['GOOGLE_SERVICE_ACCOUNT_JSON'], encoding='utf-8')"

      - name: Restore seen-jobs cache
        uses: actions/cache@v4
        with:
          path: state
          key: seen-jobs-${{ github.run_id }}
          restore-keys: |
            seen-jobs-

      - name: Run scanner
        env:
          GOOGLE_SERVICE_ACCOUNT_FILE: credentials.json
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_WORKSHEET: ${{ secrets.GOOGLE_SHEET_WORKSHEET }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set +e
          python -m src.run
          code=$?
          if [ "$code" -eq 0 ]; then
            exit 0
          fi
          if [ "$code" -eq 1 ]; then
            echo "::warning::Some career boards failed (Tesla/Apple/Google often 403 from GitHub IPs). New sheet rows were still written. Search the log for 'ERROR [run]'."
            exit 0
          fi
          exit "$code"

      - name: Report planned sheet writes
        if: always()
        run: |
          log=$(ls logs/run-*.log 2>/dev/null | tail -1 || true)
          if [ -z "$log" ]; then
            msg="No run log found; scan may have failed before logging."
            echo "$msg"
            echo "::warning::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          planned=$(grep -E 'Sheet write planned:' "$log" | tail -1 || true)
          done=$(grep -E 'Done: added=' "$log" | tail -1 || true)
          if [ -n "$planned" ]; then
            echo "$planned"
            echo "::notice::$planned"
            echo "$planned" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$done" ]; then
            echo "$done"
            echo "::notice::$done"
            echo "$done" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -z "$planned" ] && [ -z "$done" ]; then
            msg="No sheet-write count in $log (scan likely timed out or crashed before the write)."
            echo "$msg"
            echo "::warning::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-logs
          path: logs/
          if-no-files-found: ignore
