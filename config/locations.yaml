# US location filter. Tune this file, not filter.py.
#
# A posting is kept if the location looks US (country name, state name, or
# "City, ST" abbreviation). It is dropped if a foreign country is named and
# there is no US signal. Empty / "Remote" / city-only strings are kept.

us_country:
  - united states of america
  - united states
  - u.s.a.
  - u.s.a
  - usa
  - u.s.
  - u.s
  - us

